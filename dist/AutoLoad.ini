; AutoLoad.dll 热键与配置
; 与 AutoLoad_nolog.dll 放在同一游戏目录; 删除本文件 = 恢复默认 (装车 Ctrl+D + 变体选择 Ctrl+T)。
[AutoLoad]
; 格式: [Ctrl+][Alt+][Shift+][Win+]主键 (可任意组合, 如 Ctrl+Alt+K)
; 主键: A-Z, 0-9, F1-F24, Space, Tab, Enter, Backspace, Insert, Delete,
;       Home, End, PageUp, PageDown, Up, Down, Left, Right, Num0-Num9
; 设为 None 可禁用对应热键。

; 自动装车: 把选中的单位送进选中的载具
Hotkey=Ctrl+D
; 其它例子:
;Hotkey=Alt+D
;Hotkey=Ctrl+Shift+F

; 同类变体选择: 按武器实际值过滤的T键 (IFV等同注册名不同武器单位按变体加选)
; 按一次=同屏, 500ms内按第二次=全图; 只用普通Weapon归类, 忽略EliteWeapon
VariantHotkey=Ctrl+T
; 其它例子:
;VariantHotkey=Alt+T
;VariantHotkey=Ctrl+Shift+T

; 就近装载
; 红警原本装载单位顺序是比较随机的，可能出现最近的单位等待最远的单位，导致在载具旁等待很久。
; 这个开关尽量实现了近的单位先上车。
; 但是这里的实现并不完美，为了联机同步无法改底层行为，只是延迟模拟玩家操作上车。
; 这需要后台维持着计时和超时，这导致有些命令本该打断上车，实际上可能无法打断。例如 X 散开、鼠标移动都是 Move，而散开也可以自定义快捷键。
; 这导致本应中断上车的一些指令，在有时仍会延迟做出上车行为。有时会出现等的太久被判定为无法到达。
; s g 向远处移动时可终止。
; Stagger=0 关闭 默认，(同帧全下发, 旧行为, 上车顺序随机)。
; Stagger=1 开启
Stagger=0
